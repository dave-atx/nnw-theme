# The only way nnw-theme reaches npm: a vX.Y.Z tag, the full CI including the packed
# check, then the maintainer's approval in the npm environment. Trusted Publishing
# (OIDC) authenticates; no npm token exists anywhere.
name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm with Trusted Publishing
        run: npm install --global npm@11.19.1
      - name: Check the tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version." >&2
            exit 1
          fi
          major=${version%%.*}
          # 0.x and -suffixed versions are pre-releases: they go to the next dist-tag,
          # so neither latest nor @1 ever resolves to one.
          case "$major:$version" in
            0:*|*-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist-tag }}"
      # Themes call the reusable workflows at vMAJOR, which moves with each stable
      # release so a workflow change and the code it expects land together.
      # Pre-releases leave it alone.
      - name: Move the major tag
        if: steps.version.outputs.prerelease == 'false'
        env:
          MAJOR: v${{ steps.version.outputs.major }}
        run: |
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" "${flags[@]}"
