# Reusable: publishes a theme release from the default branch. Called from a
# workflow_dispatch caller that grants contents: write.
name: Publish theme

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag beginning with v (for example, v1.0.0)
        type: string
        required: true
      notes:
        description: Optional release notes (default generated by git-cliff from .github/cliff.toml, if present)
        type: string
        default: ""
      nnw-theme-version:
        description: npm version or tag of nnw-theme (for example 1 or next)
        type: string
        default: "2"
      tool-ref:
        description: Ref of dave-atx/nnw-theme whose setup action to use; match the ref in uses
        type: string
        default: v2

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Validate tag and default-branch commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v*) ;; *) echo "Tag must begin with v." >&2; exit 1;; esac
          git check-ref-format "refs/tags/$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          echo "Releasing default-branch commit $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dave-atx/nnw-theme
          ref: ${{ inputs.tool-ref }}
          path: .nnw-theme-tool
          persist-credentials: false
      - uses: ./.nnw-theme-tool/.github/actions/setup
        with:
          nnw-theme-version: ${{ inputs.nnw-theme-version }}
      - name: Validate, package, and check
        run: npx --yes "nnw-theme@$NNW_THEME_VERSION" check --no-open
      - name: Compare with previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$previous" ]; then
            mkdir -p build/previous
            gh release download "$previous" --pattern '*.nnwtheme.zip' --dir build/previous
            previous_asset=$(find build/previous -maxdepth 1 -name '*.nnwtheme.zip' -print -quit)
            test -n "$previous_asset"
            npx --yes "nnw-theme@$NNW_THEME_VERSION" release-check --previous-asset "$previous_asset"
          else
            echo "First release: no earlier identity to compare."
          fi
      - name: Report optional marketplace warnings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          description=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.description // ""')
          topics=$(gh api "repos/$GITHUB_REPOSITORY/topics" --jq '.names | join(" ")')
          test "$visibility" = public || echo "Warning: private repositories are not discoverable." | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$description" || echo "Warning: add a useful repository description." | tee -a "$GITHUB_STEP_SUMMARY"
          case " $topics " in *" netnewswire-theme "*|*" netnewswire "*) ;; *) echo "Warning: marketplace topic is absent." | tee -a "$GITHUB_STEP_SUMMARY";; esac
          test -f screenshots/theme-preview.png || echo "Warning: screenshots/theme-preview.png is absent." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Create exact tag and stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          asset=$(find build/release -maxdepth 1 -name '*.nnwtheme.zip' -print -quit)
          test -n "$asset"
          sha=$(git rev-parse HEAD)
          # Typed notes win. Otherwise a theme with a git-cliff configuration gets notes
          # generated from its commits since the previous tag.
          if [ -z "$NOTES" ] && [ -f .github/cliff.toml ]; then
            NOTES=$(npx --yes git-cliff@2.14.2 --config .github/cliff.toml \
              --unreleased --tag "$TAG" --strip header)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Theme release $TAG."
          fi
          gh release create "$TAG" "$asset" --target "$sha" --title "$TAG" --notes "$NOTES"
          echo "Published $TAG from $sha with $(basename "$asset")." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Marketplace listing guide: https://dave-atx.github.io/nnw-theme-marketplace/get-listed/" | tee -a "$GITHUB_STEP_SUMMARY"
