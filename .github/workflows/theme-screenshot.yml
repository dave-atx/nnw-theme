# Reusable: renders the marketplace screenshot in macOS WebKit and opens a pull
# request with it. Called from a workflow_dispatch caller that grants
# contents: write and pull-requests: write.
name: Refresh marketplace screenshot

on:
  workflow_call:
    inputs:
      fixture:
        description: Fixture to capture
        type: string
        default: article
      appearance:
        description: Appearance to capture (light or dark)
        type: string
        default: light
      nnw-theme-version:
        description: npm version or tag of nnw-theme (for example 1 or next)
        type: string
        default: "1"
      tool-ref:
        description: Ref of dave-atx/nnw-theme whose setup action to use; match the ref in uses
        type: string
        default: v1

jobs:
  screenshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dave-atx/nnw-theme
          ref: ${{ inputs.tool-ref }}
          path: .nnw-theme-tool
          persist-credentials: false
      - uses: ./.nnw-theme-tool/.github/actions/setup
        with:
          nnw-theme-version: ${{ inputs.nnw-theme-version }}
          webkit-deps: "false"
      - name: Capture and promote the deliberate 16:10 image
        env:
          FIXTURE: ${{ inputs.fixture }}
          APPEARANCE: ${{ inputs.appearance }}
        run: >-
          npx --yes "nnw-theme@$NNW_THEME_VERSION" screenshot
          --fixture "$FIXTURE"
          --platform mac
          --appearance "$APPEARANCE"
          --promote
      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: theme-preview-${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git switch -c "$BRANCH"
          git add screenshots/theme-preview.png
          if git diff --cached --quiet; then
            echo "The promoted screenshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh theme preview screenshot"
          git push --set-upstream origin "$BRANCH"
          if ! gh pr create --base "$BASE" \
            --head "$BRANCH" --title "Refresh theme preview screenshot" \
            --body "Generated on macOS WebKit for deliberate visual review."; then
            echo "::error::Could not open the pull request. The screenshot is pushed to $BRANCH. If the message above says Actions may not create pull requests, turn on Settings -> Actions -> General -> Workflow permissions -> Allow GitHub Actions to create and approve pull requests, then rerun."
            exit 1
          fi
